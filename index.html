    <link rel="icon" type="image/svg+xml" href="/assets/box.svg" />
    <title>Vivian La Farina | Data & Architecture</title>
    <script>
      // Apply the saved theme before React loads to avoid a flash of the wrong theme.
      (() => {
        try {
          const saved = localStorage.getItem('vlf-theme');
          const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          const theme = saved === 'dark' || saved === 'light' ? saved : system;
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#18181b' : '#e7e7ea';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
